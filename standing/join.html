<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="스탠딩 공연 입장번호 대기줄 확인">
  <title>입장번호</title>
  <!-- 앱(Flutter)과 같은 Material 아이콘 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- 관객 웹. 앱이 없는 관객이 참가 QR(…/join?code=XXXXXX)을 찍으면 여기로 온다.
       화면은 관객 앱(flutter/apps/audience/lib/ui)과 같게, 서버·규칙도 같게. 블루투스 앞뒤 번호 찾기·푸시 알림은 앱에만 있다. -->
  <div id="toast" class="toast" hidden></div>
  <main id="app"></main>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
